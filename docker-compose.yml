# Run the FireTwin-Lite services in containers.
# The LLM stays in Ollama on the host machine (no second copy of the model in Docker).
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      OLLAMA_HOST: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docs:/app/docs   # keep the audit log on the host

  mosquitto:               # MQTT broker for the simulated detectors
    image: eclipse-mosquitto:2.0.20
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
