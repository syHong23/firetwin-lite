# Continuous integration: run the tests and build the Docker image on every push.
name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t firetwin-lite .
      - name: Smoke test the container
        run: |
          docker run -d -p 8000:8000 --name firetwin firetwin-lite
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 2; done
          curl -sf "http://localhost:8000/route?space=Room102&fire=CompA0" | grep refuge
